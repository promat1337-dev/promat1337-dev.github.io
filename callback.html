<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clipper Login</title>
<style>
body{font-family:system-ui,sans-serif;max-width:720px;margin:40px auto;padding:0 16px;line-height:1.6;color:#222;background:#fff}
textarea{width:100%;height:120px;font-family:monospace;font-size:13px}
button{font-size:16px;padding:8px 16px;margin-top:8px;cursor:pointer}
</style>
</head>
<body>
<h1>Almost done</h1>
<p id="msg">Copy the text below and paste it into the Clipper terminal window.</p>
<textarea id="url" readonly></textarea><br>
<button id="copy">Copy</button>
<script>
  var box = document.getElementById("url");
  box.value = window.location.href;
  if (window.location.search.indexOf("code=") === -1) {
    document.getElementById("msg").textContent = "No login code found on this page. Start the login again from the terminal.";
  }
  document.getElementById("copy").onclick = function () {
    box.select();
    try { navigator.clipboard.writeText(box.value); } catch (e) { document.execCommand("copy"); }
    this.textContent = "Copied!";
  };
</script>
</body>
</html>
